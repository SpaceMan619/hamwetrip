name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Detects whether this push/PR touches the Firestore rules Jotham owns, so
  # the rules test suite only runs (and only gates merges) when it needs to.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rules: ${{ steps.filter.outputs.rules }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rules:
              - 'firestore.rules'
              - 'firestore.indexes.json'
              - 'test-rules/**'

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hamwetrip
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test

  rules:
    needs: changes
    if: needs.changes.outputs.rules == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test-rules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm install -g firebase-tools
      - run: npm test
