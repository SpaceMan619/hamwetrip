name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege. Nothing here needs to write to the repository or read pull
# request metadata — the rules suite runs unconditionally, so no job has to ask
# the API which files changed.
permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hamwetrip
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test

  # Runs on every push and pull request, deliberately not gated on whether
  # firestore.rules changed.
  #
  # Repository code is written against rule behaviour, so it breaks against the
  # rules without touching them. PR #5 is the worked example: it changed no
  # rules file, so a path filter skipped this suite, and it shipped two P0s that
  # were purely rule failures — createTrip reading a trip nobody was yet a
  # member of, and leaveTrip writing an audit event after dropping the
  # membership that authorized it. A filter keyed on rules files skips this
  # suite precisely when repository code changes, which is when it is most
  # likely to catch something.
  #
  # The whole suite is about a minute including emulator startup. That is not
  # worth optimising away.
  rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test-rules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: test-rules/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm install -g firebase-tools
      - run: npm test
