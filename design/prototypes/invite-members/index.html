<!-- Toast Notification for Copy Link (hidden by default) -->
<div class="fixed bottom-28 left-1/2 -translate-x-1/2 bg-inverse-surface text-inverse-on-surface px-6 py-3 rounded-full font-label-md text-label-md shadow-xl transition-all duration-300 translate-y-20 opacity-0 z-[60] flex items-center gap-2" id="copy-toast">
<span class="material-symbols-outlined text-[18px]" data-icon="check_circle">check_circle</span>
        Link copied to clipboard!
    </div>
<script>
        function copyToClipboard() {
            const link = "harmwaytrip.app/akagera";
            navigator.clipboard.writeText(link).then(() => {
                const toast = document.getElementById('copy-toast');
                toast.classList.remove('translate-y-20', 'opacity-0');
                toast.classList.add('translate-y-0', 'opacity-100');
                
                setTimeout(() => {
                    toast.classList.add('translate-y-20', 'opacity-0');
                    toast.classList.remove('translate-y-0', 'opacity-100');
                }, 2000);
            });
        }

        // Simple checkbox visual interaction
        document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const parent = this.closest('label');
                if (this.checked) {
                    parent.classList.add('border-primary/40', 'bg-primary-container/5');
                } else {
                    parent.classList.remove('border-primary/40', 'bg-primary-container/5');
                }
            });
        });
    </script>
