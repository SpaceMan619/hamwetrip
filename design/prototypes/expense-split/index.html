<script>
        function selectCategory(el) {
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('bg-primary-container', 'text-on-primary-container');
                btn.classList.add('bg-surface-container');
                btn.querySelector('span').classList.remove('active-icon');
            });
            el.classList.add('bg-primary-container', 'text-on-primary-container');
            el.classList.remove('bg-surface-container');
            el.querySelector('span').classList.add('active-icon');
        }

        function toggleFriend(el) {
            const img = el.querySelector('img');
            const check = el.querySelector('.check-mark');
            const isActive = img.classList.contains('grayscale');
            
            if(isActive) {
                img.classList.remove('grayscale');
                img.classList.add('border-secondary-container');
                check.classList.remove('scale-0');
                check.classList.add('scale-100');
            } else {
                img.classList.add('grayscale');
                img.classList.remove('border-secondary-container');
                check.classList.add('scale-0');
                check.classList.remove('scale-100');
            }
        }

        // Initialize first category and first friend
        window.onload = () => {
            selectCategory(document.querySelectorAll('.category-btn')[1]);
        };
