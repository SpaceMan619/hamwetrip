<script>
        // Micro-interaction for input fields
        const inputs = document.querySelectorAll('.pill-input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label').classList.add('text-secondary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('label').classList.remove('text-secondary');
            });
        });

        // Simulate offline state detection
        window.addEventListener('offline', () => {
            document.getElementById('offline-bar').classList.remove('hidden');
        });
        window.addEventListener('online', () => {
            document.getElementById('offline-bar').classList.add('hidden');
        });

        // Simple scale interaction for buttons
        const buttons = document.querySelectorAll('button');
        buttons.forEach(btn => {
            btn.addEventListener('mousedown', () => btn.classList.add('scale-95'));
            btn.addEventListener('mouseup', () => btn.classList.remove('scale-95'));
            btn.addEventListener('mouseleave', () => btn.classList.remove('scale-95'));
        });
    </script>
